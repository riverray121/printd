[project]
name = "printd"
version = "0.1.0"
description = "A self-hosted print daemon: slice, gate, preview, print, and watch 3D prints from any MCP client or the CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "fastmcp>=2.0",
]

[project.scripts]
printctl = "printd.cli:main"
printd-server = "printd.mcp_server:main"
printd-watch = "printd.watcher:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
